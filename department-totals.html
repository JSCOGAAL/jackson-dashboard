<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jackson Services — Department Totals</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f2ee; --surface: #ffffff; --surface2: #f9f8f6;
    --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.14);
    --text: #1a1815; --text-secondary: #6b6760; --text-tertiary: #a09d98;
    --accent: #d4500a; --success: #1a7a57; --warning: #c4460d;
    --radius: 10px; --radius-sm: 6px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

  #loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 16px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text-secondary); }

  #dashboard { display: none; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 52px; position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark { width: 28px; height: 28px; background: var(--accent); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 11px; }
  .logo-text { font-size: 14px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; color: var(--text-secondary); margin-left: 6px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-meta { font-size: 11px; color: var(--text-tertiary); font-family: 'DM Mono', monospace; }
  .refresh-btn { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; padding: 5px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface2); color: var(--text-secondary); cursor: pointer; }
  .refresh-btn:hover { color: var(--text); border-color: var(--accent); }

  .main { padding: 20px 24px; }

  /* KPI GRID */
  .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; position: relative; overflow: hidden; }
  .kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); opacity: 0.35; }
  .kpi.green::before  { background: var(--success); opacity: 1; }
  .kpi.orange::before { background: var(--accent); opacity: 1; }
  .kpi.blue::before   { background: #1a5fa8; opacity: 1; }
  .kpi-label { font-size: 10px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
  .kpi-val { font-size: 24px; font-weight: 600; letter-spacing: -0.8px; color: var(--text); line-height: 1; margin-bottom: 3px; }
  .kpi-val.accent { color: var(--accent); }
  .kpi-val.green  { color: var(--success); }
  .kpi-sub { font-size: 11px; color: var(--text-tertiary); }

  /* METRICS GRID */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .card-title { font-size: 12px; font-weight: 600; letter-spacing: -0.2px; }

  .metrics-wrap { padding: 12px 16px; }
  .metrics-division { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .metrics-division:last-child { border-bottom: none; padding-bottom: 0; }
  .metrics-div-name { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  .metrics-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .metric-item { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 6px; text-align: center; }
  .metric-item-label { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-tertiary); margin-bottom: 4px; }
  .metric-item-value { font-size: 16px; font-weight: 600; letter-spacing: -0.5px; line-height: 1; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th { padding: 8px 12px; text-align: left; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-secondary); border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface2); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #faf9f7; }
  td.name-cell { font-weight: 600; font-size: 13px; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-green  { background: #e5f5ee; color: var(--success); }
  .badge-orange { background: #fdf0ea; color: var(--accent); }
  .badge-yellow { background: #fdf6e3; color: #a06010; }

  footer { text-align: center; padding: 16px; font-size: 11px; color: var(--text-tertiary); font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <div class="loading-text">Loading department data...</div>
</div>

<div id="dashboard">
  <header>
    <div class="logo">
      <div class="logo-mark">JS</div>
      <span class="logo-text">Jackson Services</span>
      <span class="logo-sub">Department Totals</span>
    </div>
    <div class="header-right">
      <span class="header-meta" id="lastUpdated"></span>
      <span class="header-meta">Auto-refreshes hourly</span>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>
  </header>

  <div class="main">

    <!-- KPI CARDS -->
    <div class="kpi-grid" id="dispatch-stats"></div>

    <!-- KEY METRICS BY DIVISION -->
    <div class="card">
      <div class="card-head"><span class="card-title">Key Metrics by Division</span></div>
      <div class="metrics-wrap" id="metrics-grid"></div>
    </div>

    <!-- DIVISION TABLE -->
    <div class="card">
      <div class="card-head"><span class="card-title">Department Totals by Division</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Division</th><th>Canceled</th><th>Revenue</th>
            <th>Weekly Pace</th><th>Monthly Pace</th><th>Yearly Pace</th><th>Crew Days</th>
          </tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

  </div>
  <footer>Jackson Services &nbsp;·&nbsp; Department Totals &nbsp;·&nbsp; Month to Date</footer>
</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0NT7lEqqpwrkgoy6vcIuFkgmUA979edn_-ufgaxcbcIQsyho4vTVPGXlA9C1zXEGz-A3Ysy95y1xy/pub?gid=2025286502&single=true&output=csv';

function fmt$(v) {
  const n = parseFloat(String(v).replace(/[$,%]/g,''));
  if (isNaN(n)) return v;
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtPct(v) {
  const n = parseFloat(String(v).replace('%','').trim());
  return isNaN(n) ? v : n.toFixed(1) + '%';
}

async function fetchCSV(url) {
  try { const r = await fetch(url); if (r.ok) return await r.text(); } catch(e) {}
  try { const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`); if (r.ok) return await r.text(); } catch(e) {}
  return null;
}

async function loadData() {
  const csv = await fetchCSV(SHEET_URL);
  if (!csv) { document.getElementById('loading-screen').innerHTML = '<div style="color:#c0350d;font-size:13px">Could not load data. Check sheet sharing settings.</div>'; return; }
  renderDispatch(Papa.parse(csv, { header: true, skipEmptyLines: true }).data);
  document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

function renderDispatch(rows) {
  const divs     = rows.filter(r => r['Name'] && r['Name'].trim());
  const totalRow = divs.find(r => !r['Name'].includes(':')) || divs[divs.length-1];
  const dataRows = divs.filter(r => r['Name'].includes(':') || r['Name'].toLowerCase().includes('hvac'));

  const totalRevenue   = dataRows.reduce((s,r) => s + parseFloat(String(r['Completed Revenue']||'0').replace(/[$,]/g,'')), 0);
  const totalOpps      = dataRows.reduce((s,r) => s + parseFloat(r['Opportunity']||0), 0);
  const totalConverted = dataRows.reduce((s,r) => s + parseFloat(r['Converted Jobs']||0), 0);
  const totalCompleted = dataRows.reduce((s,r) => s + parseFloat(r['Completed Jobs']||0), 0);
  const totalCanceled  = dataRows.reduce((s,r) => s + parseFloat(r['Canceled Jobs']||0), 0);

  document.getElementById('dispatch-stats').innerHTML = `
    <div class="kpi orange"><div class="kpi-label">MTD Revenue</div><div class="kpi-val accent">${fmt$(totalRevenue)}</div><div class="kpi-sub">Completed jobs</div></div>
    <div class="kpi blue"><div class="kpi-label">Total Opportunities</div><div class="kpi-val">${totalOpps}</div><div class="kpi-sub">This month</div></div>
    <div class="kpi green"><div class="kpi-label">Converted Jobs</div><div class="kpi-val green">${totalConverted}</div><div class="kpi-sub">Of ${totalOpps} opportunities</div></div>
    <div class="kpi"><div class="kpi-label">Completed Jobs</div><div class="kpi-val">${totalCompleted}</div><div class="kpi-sub">&nbsp;</div></div>
    <div class="kpi"><div class="kpi-label">Canceled Jobs</div><div class="kpi-val" style="color:#c4460d">${totalCanceled}</div><div class="kpi-sub">&nbsp;</div></div>
  `;

  // Key metrics per division
  document.getElementById('metrics-grid').innerHTML = dataRows.map(r => {
    const name = r['Name'].trim().replace('HVAC Residential:','').trim();
    const metrics = [
      { label:'WIP Jobs',     value: r['WIP Jobs']||'—',                      color:'#1a1815' },
      { label:'Zero $ Jobs',  value: r['Zero Dollar Jobs']||'—',              color:'#c4460d' },
      { label:'Recalls',      value: r['Recall Jobs']||'—',                   color:'#a06010' },
      { label:'Returns',      value: r['Returns']||'—',                       color:'#c4460d' },
      { label:'Gross Margin', value: r['Gross Margin %']||'—',                color:'#1a7a57' },
      { label:'Cost %',       value: r['Actual Costs as % of Sales']||'—',    color:'#5b4fcf' },
      { label:'No Charge',    value: r['No Charge Jobs']||'—',                color:'#6b6760' },
    ];
    return `<div class="metrics-division">
      <div class="metrics-div-name">${name}</div>
      <div class="metrics-row">
        ${metrics.map(m => `<div class="metric-item">
          <div class="metric-item-label">${m.label}</div>
          <div class="metric-item-value" style="color:${m.color}">${m.value}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('table-body').innerHTML = dataRows.map(r => `
    <tr>
      <td class="name-cell">${r['Name'].trim()}</td>
      <td style="color:#c4460d;font-weight:500">${r['Canceled Jobs']||'-'}</td>
      <td style="font-weight:600;color:var(--accent)">${fmt$(r['Completed Revenue'])}</td>
      <td>${fmt$(r['Current Weekly Pace'])}</td>
      <td>${fmt$(r['Current Monthly Pace'])}</td>
      <td>${fmt$(r['Current Yearly Pace'])}</td>
      <td>${r['Crew Days']||'—'}</td>
    </tr>`).join('');
}

loadData();
setInterval(loadData, 60 * 60 * 1000);
</script>
</body>
</html>
